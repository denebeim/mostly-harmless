---
- name: Converge the declared VM on its Proxmox node
  ansible.builtin.script:
    cmd: "manage_vm.py {{ vm | to_json | quote }}"
    executable: /usr/bin/python3
  register: vm_result
  changed_when: (vm_result.stdout | from_json).changed

- name: Record nonsecret VM facts
  ansible.builtin.set_fact:
    vm_created: "{{ vm_result.stdout | from_json }}"

- name: Create private per-incarnation SSH trust directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.ansible/known_hosts"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Add the VM and its actual Proxmox tags to this run
  ansible.builtin.add_host:
    name: "{{ vm_created.name }}"
    ansible_host: "{{ vm_created.ip }}"
    ansible_user: ansible
    vm_known_hosts_file: "{{ playbook_dir }}/.ansible/known_hosts/{{ vm_created.id }}-{{ vm_created.mac | replace(':', '') }}"
    ansible_ssh_common_args: "-F /dev/null -o PasswordAuthentication=no -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ playbook_dir }}/.ansible/known_hosts/{{ vm_created.id }}-{{ vm_created.mac | replace(':', '') }}"
    groups: "{{ ['managed_vms'] + (vm_created.tags | map('regex_replace', '^', 'tag_') | list) }}"
  changed_when: false
