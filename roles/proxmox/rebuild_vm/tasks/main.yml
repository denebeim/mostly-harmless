- name: Check the reviewed rebuild target and dependencies
  ansible.builtin.import_tasks: preflight.yml
  tags:
  - rebuild_preflight
- name: Create a private local configuration-record directory
  ansible.builtin.file:
    path: '{{ playbook_dir }}/.ansible/rebuild-records'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
- name: Preserve the inspected configuration privately before removal
  ansible.builtin.copy:
    content: '{{ rebuild_config.stdout }}'
    dest: '{{ playbook_dir }}/.ansible/rebuild-records/{{ rebuild_vmid }}-{{ now(utc=true, fmt=''%Y%m%dT%H%M%S%f'')
      }}.json'
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
- name: Shut down only the reviewed guest without forced power-off
  community.general.proxmox_kvm:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_password: '{{ api_password }}'
    node: '{{ inventory_hostname }}'
    vmid: '{{ rebuild_vmid }}'
    state: stopped
    force: false
    timeout: 180
  no_log: true
- name: Re-read configuration before deletion to detect concurrent edits
  ansible.builtin.command:
    argv:
    - pvesh
    - get
    - /nodes/{{ inventory_hostname }}/qemu/{{ rebuild_vmid }}/config
    - --output-format
    - json
  register: rebuild_config_after_stop
  changed_when: false
  no_log: true
- name: Refuse deletion after any intervening configuration change
  ansible.builtin.assert:
    that:
    - (rebuild_config_after_stop.stdout | from_json).digest == (rebuild_config.stdout | from_json).digest
    fail_msg: Configuration changed after inspection; review it before deleting.
  no_log: true
- name: Remove only the reviewed stopped guest
  community.general.proxmox_kvm:
    api_host: '{{ api_host }}'
    api_user: '{{ api_user }}'
    api_password: '{{ api_password }}'
    node: '{{ inventory_hostname }}'
    vmid: '{{ rebuild_vmid }}'
    state: absent
    force: false
    timeout: 180
  no_log: true
