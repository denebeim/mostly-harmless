- name: Install legacy K5200 driver and matching kernel headers
  ansible.builtin.apt:
    name:
    - linux-headers-{{ ansible_facts.kernel }}
    - nvidia-driver-470
    - nvidia-utils-470
    - curl
    - zstd
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
- name: Load NVIDIA driver
  community.general.modprobe:
    name: nvidia
    state: present
- name: Verify K5200 driver
  ansible.builtin.command: nvidia-smi --query-gpu=name,memory.total,driver_version
    --format=csv,noheader
  register: gpu_info
  changed_when: false
- name: Show GPU driver result
  ansible.builtin.debug:
    var: gpu_info.stdout
