---
- name: Install Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
    public: true

- name: Manage local Docker socket membership
  when: vm.docker_members is defined or vm.docker_ipa_group is defined
  block:
    - name: Read the configured IPA Docker group through SSSD
      ansible.builtin.getent:
        database: group
        key: "{{ vm.docker_ipa_group }}"
        service: sss
      register: ipa_docker_group
      when: vm.docker_ipa_group is defined

    - name: Read the host-local Docker group
      ansible.builtin.getent:
        database: group
        key: docker
        service: files

    - name: Enforce the union of declared accounts and IPA group members
      ansible.builtin.command:
        argv: [gpasswd, -M, "{{ desired_docker_members | join(',') }}", docker]
      vars:
        ipa_members: >-
          {{ ipa_docker_group.ansible_facts.getent_group[vm.docker_ipa_group][2].split(',')
             if vm.docker_ipa_group is defined else [] }}
        desired_docker_members: >-
          {{ ((vm.docker_members | default([])) + ipa_members)
             | reject('equalto', '') | unique(case_sensitive=true) | sort | list }}
      when: >-
        (ansible_facts.getent_group.docker[2].split(',') | reject('equalto', '') | sort | list)
        != desired_docker_members

- name: Register the enrolled Docker host in central IPA authorization
  ansible.builtin.command:
    argv: [/usr/bin/python3, '-', "{{ ipa_docker_fqdn }}"]
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/register_ipa_host.py') }}"
  delegate_to: localhost
  become: false
  register: ipa_docker_registration
  changed_when: ipa_docker_registration.stdout == 'registered'
  vars:
    ipa_docker_fqdn: "{{ (vm.name ~ '.' ~ (vm.domain | default('local.deepthot.org'))) if vm is defined else ansible_facts.fqdn }}"
  when: "'tag_ipa' in group_names"
