---
- name: Install Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
    public: true

- name: Read Docker group membership when explicitly managed
  ansible.builtin.getent:
    database: group
    key: docker
  when: vm.docker_members is defined

- name: Enforce explicitly declared Docker group membership
  ansible.builtin.command:
    argv: [gpasswd, -M, "{{ vm.docker_members | join(',') }}", docker]
  when:
    - vm.docker_members is defined
    - >-
      (ansible_facts.getent_group.docker[2].split(',') | reject('equalto', '') | sort | list)
      != (vm.docker_members | sort)
