---
- name: Upgrade Ollama for Inkling on Linux
  environment:
    OLLAMA_VERSION: 0.40.18
  ansible.builtin.command: /bin/sh /var/tmp/ollama-install.sh
  notify: Restart Ollama
  when: ollama_api.json.version is version('0.40.18', '<')

- name: Apply the Ollama upgrade before pulling Inkling
  ansible.builtin.meta: flush_handlers

- name: Wait for the Inkling-compatible Ollama API
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/version
  register: inkling_ollama_api
  retries: 12
  delay: 5
  until: inkling_ollama_api.status == 200 and inkling_ollama_api.json.version is version('0.40.18', '>=')

- name: Inspect locally installed Inkling weights
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/show
    method: POST
    body_format: json
    body:
      model: "{{ ollama_inkling_source }}"
    status_code: [200, 404]
  register: ollama_inkling_show

- name: Pull Inkling weights
  ansible.builtin.command:
    argv: [ollama, pull, "{{ ollama_inkling_source }}"]
  when: ollama_inkling_show.status == 404
  async: 7200
  poll: 15

- name: Inspect the Eddie CPU model profile
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/show
    method: POST
    body_format: json
    body:
      model: "{{ ollama_inkling_model }}"
    status_code: [200, 404]
  register: ollama_inkling_profile

- name: Configure Inkling to use the CPU and a 4K context
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/create
    method: POST
    body_format: json
    body:
      model: "{{ ollama_inkling_model }}"
      from: "{{ ollama_inkling_source }}"
      stream: false
      parameters:
        num_ctx: 4096
        num_gpu: 0
  when: >-
    ollama_inkling_show.status == 404 or ollama_inkling_profile.status == 404 or
    not (ollama_inkling_profile.json.parameters | default('') is search('(?m)^num_gpu\s+0$')) or
    not (ollama_inkling_profile.json.parameters | default('') is search('(?m)^num_ctx\s+4096$'))
  changed_when: true

- name: Verify Inkling generates text before enabling it in LibreChat
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/generate
    method: POST
    timeout: 300
    body_format: json
    body:
      model: "{{ ollama_inkling_model }}"
      prompt: What is seven times eight? Answer with just the number.
      stream: false
      think: false
      keep_alive: 0
      options:
        num_predict: 256
        temperature: 0
  register: ollama_inkling_test
  failed_when: >-
    ollama_inkling_test.status != 200 or
    not (ollama_inkling_test.json.done | default(false)) or
    (ollama_inkling_test.json.response | default('') | trim) != '56'
