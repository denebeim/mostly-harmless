- name: Download official Ollama installer
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /var/tmp/ollama-install.sh
    mode: '0700'
- name: Install Ollama
  environment:
    OLLAMA_VERSION: 0.40.15
  ansible.builtin.command: /bin/sh /var/tmp/ollama-install.sh
  args:
    creates: /usr/local/bin/ollama
- name: Create Ollama service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Configure Ollama listening address
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/listen.conf
    owner: root
    group: root
    mode: '0644'
    content: '[Service]

      Environment="OLLAMA_HOST={{ ollama_listen_host | default(''127.0.0.1'') }}:11434"

      '
  notify: Restart Ollama
- name: Apply Ollama listening changes before API checks and model pulls
  ansible.builtin.meta: flush_handlers
- name: Enable Ollama service
  ansible.builtin.systemd_service:
    name: ollama
    state: started
    enabled: true
    daemon_reload: true
- name: Wait for Ollama API
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/version
  register: ollama_api
  retries: 12
  delay: 5
  until: ollama_api.status == 200
- name: Verify Ollama API over the LAN from the controller
  ansible.builtin.uri:
    url: http://{{ ansible_host | default(inventory_hostname) }}:11434/api/version
    use_proxy: false
  delegate_to: localhost
  become: false
  register: ollama_lan_api
  retries: 12
  delay: 5
  until: ollama_lan_api.status == 200
  when: ollama_verify_lan | default(false) | bool
- name: List installed Ollama models
  ansible.builtin.command: ollama list
  register: installed_models
  changed_when: false
- name: Pull the reference Qwen model
  ansible.builtin.command: ollama pull qwen3.5:4b
  when: '''qwen3.5:4b'' not in installed_models.stdout'
  async: 1800
  poll: 10
