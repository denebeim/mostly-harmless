---
- name: Install ISC BIND9 and Kea DHCP packages
  ansible.builtin.apt:
    name:
      - bind9
      - bind9utils
      - kea-dhcp4-server
      - kea-dhcp-ddns-server
    state: present
    update_cache: true

- name: Ensure low-level system hosts are present in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.ip | regex_escape }}\\s+"
    line: "{{ item.ip }} {{ item.name }}.{{ domain_name }} {{ item.name }}"
    state: present
  loop: "{{ low_level_hosts }}"

- name: Deploy BIND9 named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  notify: Reload bind9

- name: Deploy BIND9 forward zone for local.deepthot.org
  ansible.builtin.template:
    src: db.local.deepthot.org.j2
    dest: /var/lib/bind/db.local.deepthot.org
    owner: bind
    group: bind
    mode: "0644"
    force: false
  notify: Reload bind9

- name: Deploy Kea DHCPv4 configuration with MAC classification
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: _kea
    mode: "0640"
  notify: Restart kea-dhcp4-server

- name: Deploy Kea DHCP-DDNS configuration
  ansible.builtin.template:
    src: kea-dhcp-ddns.conf.j2
    dest: /etc/kea/kea-dhcp-ddns.conf
    owner: root
    group: _kea
    mode: "0640"
  notify: Restart kea-dhcp-ddns-server

- name: Validate BIND9 and Kea configurations
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - named-checkconf
    - kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
    - kea-dhcp-ddns -t /etc/kea/kea-dhcp-ddns.conf

- name: Enable and start ISC services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - bind9
    - kea-dhcp4-server
    - kea-dhcp-ddns-server
