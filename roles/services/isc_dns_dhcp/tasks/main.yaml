---
- name: Read host and reservation inventory from hosts.csv
  ansible.builtin.set_fact:
    isc_hosts_list: >-
      {{
        lookup('ansible.builtin.file', 'hosts.csv').splitlines()[1:]
        | select('truthy')
        | map('split', ',')
        | map('zip', ['name', 'ip', 'mac', 'in_etc_hosts', 'zone_group'])
        | map('map', 'reverse')
        | map('community.general.dict')
        | list
      }}

- name: Install ISC BIND9 and Kea DHCP packages
  ansible.builtin.apt:
    name:
      - bind9
      - bind9utils
      - kea-dhcp4-server
      - kea-dhcp-ddns-server
    state: present
    update_cache: true

- name: Manage low-level system hosts block in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED DEEPTHOT SYSTEM HOSTS"
    block: |
      {% for item in isc_hosts_list | selectattr('in_etc_hosts', 'equalto', 'true') | list %}
      {{ item.ip }} {{ item.name }}.{{ domain_name }} {{ item.name }}
      {% endfor %}

- name: Deploy BIND9 named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  notify: Reload bind9

- name: Deploy BIND9 forward zone for local.deepthot.org
  ansible.builtin.template:
    src: db.local.deepthot.org.j2
    dest: /var/lib/bind/db.local.deepthot.org
    owner: bind
    group: bind
    mode: "0644"
    force: false
  notify: Reload bind9

- name: Deploy Kea DHCPv4 configuration with MAC classification
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: _kea
    mode: "0640"
  notify: Restart kea-dhcp4-server

- name: Deploy Kea DHCP-DDNS configuration
  ansible.builtin.template:
    src: kea-dhcp-ddns.conf.j2
    dest: /etc/kea/kea-dhcp-ddns.conf
    owner: root
    group: _kea
    mode: "0640"
  notify: Restart kea-dhcp-ddns-server

- name: Validate BIND9 and Kea configurations
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - named-checkconf
    - kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
    - kea-dhcp-ddns -t /etc/kea/kea-dhcp-ddns.conf

- name: Enable and start ISC services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - bind9
    - kea-dhcp4-server
    - kea-dhcp-ddns-server
