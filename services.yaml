---
- ansible.builtin.import_playbook: vm.yaml
  vars:
    vm:
      name: services
      id: 202
      ip: 192.168.42.2
      memory: 2048
      cores: 2
      disk: 16G
      update_packages: false
      tags: []

- name: Configure foundational DNS and DHCP services on services
  hosts: services
  become: true
  gather_facts: true
  roles:
    - role: services/bind9
    - role: services/kea
