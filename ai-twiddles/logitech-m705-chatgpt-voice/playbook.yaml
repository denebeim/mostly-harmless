# Personal desktop experiment; see README.md.
- name: chatgpt personal mouse voice button
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Create launcher directory
      ansible.builtin.file:
        path: '{{ target_home }}/.local/bin'
        state: directory
        mode: '0755'
    - name: Install captured launcher
      ansible.builtin.copy:
        src: files/chatgpt-voice-toggle
        dest: '{{ target_home }}/.local/bin/chatgpt-voice-toggle'
        mode: '0755'
    - name: Save button mapping and GNOME shortcut
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import ast,json,subprocess,sys,shlex
            from pathlib import Path
            home=Path(sys.argv[1])
            preset=sys.argv[2]
            base=home/'.config/input-remapper-2'
            p=base/'presets/Logitech M705'/f'{preset}.json'
            p.parent.mkdir(parents=True,exist_ok=True)
            items=json.loads(p.read_text()) if p.exists() else []
            items=[m for m in items if not any(e.get('type')==1 and e.get('code')==276 for e in m.get('input_combination',[]))]
            items.append({'input_combination':[{'type':1,'code':276,'origin_hash':''}],'target_uinput':'keyboard','output_symbol':'Control_L + Alt_L + Shift_L + v','mapping_type':'key_macro'})
            p.write_text(json.dumps(items,indent=4)+'\n')
            p=base/'config.json'
            config=json.loads(p.read_text()) if p.exists() else {}
            config.setdefault('autoload',{})['Logitech M705']=preset
            p.write_text(json.dumps(config,indent=4)+'\n')
            schema='org.gnome.settings-daemon.plugins.media-keys'
            path='/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/'
            paths=ast.literal_eval(subprocess.check_output(['gsettings','get',schema,'custom-keybindings'],text=True).removeprefix('@as '))
            if path not in paths: paths.append(path)
            subprocess.run(['gsettings','set',schema,'custom-keybindings',repr(paths)],check=True)
            for field,value in [('name','chatgpt Voice Toggle'),('command',shlex.join(['/usr/bin/python3',sys.argv[3],str(home/'.local/bin/chatgpt-voice-toggle')])),('binding','<Control><Alt><Shift>v')]:
             subprocess.run(['gsettings','set',schema+'.custom-keybinding:'+path,field,repr(value)],check=True)
          - '{{ target_home }}'
          - '{{ mouse_preset }}'
          - '{{ playbook_dir | dirname | dirname }}/scripts/log-session.py'
      changed_when: true
  become: false
  vars:
    target_home: '{{ ansible_facts.user_dir }}'
    mouse_preset: '{{ target_home | replace(''/'', ''_'') }}'
