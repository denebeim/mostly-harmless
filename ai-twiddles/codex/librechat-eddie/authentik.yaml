---
- name: Register the existing Authentik service for this deployment
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Add the Authentik deployment target
      ansible.builtin.add_host:
        name: authentik-services
        groups: librechat_authentik
        ansible_host: 192.168.42.2
        ansible_python_interpreter: /usr/bin/python3
      when: groups.get('librechat_authentik', []) | length == 0
      changed_when: false

- name: Manage Eddie's OpenID Connect application in Authentik
  hosts: librechat_authentik
  gather_facts: false
  any_errors_fatal: true
  vars:
    librechat_authentik_container: authentik_server_1
    librechat_authentik_group: Folks who Live Here
    librechat_authentik_extra_user: ookami
  tasks:
    - name: Require the Eddie SSO vault
      ansible.builtin.assert:
        that:
          - librechat_oidc_enabled | default(false) | bool
          - librechat_url | default('') == 'https://eddie.local.deepthot.org'
          - librechat_oidc_client_id | default('') | length > 0
          - librechat_oidc_client_secret | default('') | length > 0
        fail_msg: Supply the private Eddie SSO variables to this playbook.
      no_log: true

    - name: Converge the confidential provider and scoped app access
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - "{{ librechat_authentik_container }}"
          - ak
          - shell
          - -c
          - "import sys; exec(sys.stdin.read())"
        stdin: "{{ lookup('ansible.builtin.template', 'authentik-provider.py.j2') }}"
      register: librechat_authentik_result
      changed_when: "'EDDIE_PROVIDER_CHANGED' in librechat_authentik_result.stdout"
      no_log: true
