---
- ansible.builtin.import_playbook: vm.yaml
  vars:
    vm:
      name: eddie
      id: 314
      ip: 192.168.42.132
      memory: 16384
      cores: 8
      disk: 40G
      bios: ovmf
      machine: q35
      local_users: [hermes]
      docker_members: [hermes]
      update_packages: true
      tags: [ipa, docker, gpu, ollama, hermes]
      hostpci:
        hostpci0: "0000:81:00,pcie=1"
    hermes_default_model: qwen3.5:4b
    hermes_provider: custom
    hermes_base_url: http://127.0.0.1:11434/v1
    ollama_listen_host: 0.0.0.0
    ollama_verify_lan: true
    hermes_gpu_devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
