---
# =============================================================================
# Playbook: eddie.yaml
# Description: Provisions a virtual machine on Proxmox VE (heartogold)
#              and installs/configures Nous Research Hermes AI Agent.
# =============================================================================

- name: Provision Eddie VM on Proxmox
  hosts: "heartogold"
  remote_user: root
  gather_facts: false

  vars:
    clone: "deepthot-24-04"
    api_host: "heartogold"
    vmname: "eddie"
    newid: 314
    memory: 16384
    cores: 8
    bios: ovmf
    machine: q35
    vga: serial0
    vm_serial:
      serial0: socket
    hostpci:
      hostpci0: "0000:81:00,pcie=1"
    size: "40G"
    storage: "heartogold"
    IP: "{{ eddie_ip | default(hermes_ip | default('192.168.42.132')) }}"
    ciupgrade: false
    gateway: "192.168.42.1"
    nameserver: "192.168.42.2"
    searchdomain: "local.deepthot.org"
    mytags:
      - ipa
      - hermes
      - docker

  pre_tasks:
    - name: Check the controller Kerberos ticket before provisioning
      ansible.builtin.command: klist -s
      delegate_to: localhost
      become: false
      register: controller_ticket
      changed_when: false
      failed_when: false

    - name: Require an existing admin Kerberos ticket
      ansible.builtin.assert:
        that: controller_ticket.rc == 0
        fail_msg: "Run kinit admin in this terminal, then rerun the playbook. No password prompt is used by Ansible."

  roles:
    - proxmox/create_vm

  post_tasks:
    - name: Dynamically add Eddie VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ vmname }}"
        ansible_host: "{{ IP }}"
        ansible_user: ansible
        ansible_ssh_common_args: "-F /dev/null -o UserKnownHostsFile={{ playbook_dir }}/.ansible/eddie-smoke-known-hosts -o PasswordAuthentication=no"
        groups:
          - eddie
          - hermes
          - "{{ 'tag_ipa' if 'ipa' in mytags else '' }}"
          - "{{ 'tag_docker' if 'docker' in mytags else '' }}"

    - name: Wait for SSH port 22 on Eddie VM ({{ IP }})
      ansible.builtin.wait_for:
        host: "{{ IP }}"
        port: 22
        search_regex: OpenSSH
        delay: 10
        timeout: 300
      delegate_to: localhost

    - name: Wait for initial cloud-init before bootstrapping guest agent
      ansible.builtin.command: cloud-init status --wait --long
      delegate_to: "{{ vmname }}"
      register: bootstrap_cloud_init
      changed_when: false
      failed_when: >-
        bootstrap_cloud_init.rc != 0 and not
        (bootstrap_cloud_init.rc == 2 and 'status: done' in bootstrap_cloud_init.stdout and
         'errors: []' in bootstrap_cloud_init.stdout)

    - name: Install missing guest agent using the smoke-tested SSH identity
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
      delegate_to: "{{ vmname }}"

    - name: Enable the guest agent for hypervisor verification
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        enabled: true
        state: started
      become: true
      delegate_to: "{{ vmname }}"

    - name: Refresh verified SSH trust for Eddie
      ansible.builtin.include_role:
        name: proxmox/ssh_host_key
      vars:
        ssh_host_key_names:
          - "{{ vmname }}"
          - "{{ vmname }}.{{ domain }}"

    - name: Wait for authenticated SSH access to Eddie
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
      delegate_to: "{{ vmname }}"

- name: Configure Eddie identity, Docker and Hermes Agent
  hosts: eddie
  remote_user: ansible
  become: true
  gather_facts: true

  # These will be picked up from the inventory file we fixed above
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: "-F /dev/null -o PasswordAuthentication=no"
    hermes_default_model: qwen3.5:4b
    hermes_gateway_enabled: true
    hermes_provider: custom
    hermes_base_url: http://127.0.0.1:11434/v1

  pre_tasks:
    - name: Wait for cloud-init to finish provisioning
      ansible.builtin.command: cloud-init status --wait --long
      register: cloud_init_status
      changed_when: false
      failed_when: >-
        cloud_init_status.rc != 0 and
        not (
          cloud_init_status.rc == 2 and
          'status: done' in cloud_init_status.stdout and
          'errors: []' in cloud_init_status.stdout
        )

    - name: Wait for apt locks to release
      ansible.builtin.shell: while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 1; done;
      changed_when: false

    - name: Update installed Ubuntu packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        force_apt_get: true
        lock_timeout: 600

    - name: Check whether package updates require a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: eddie_reboot_required

    - name: Reboot Eddie when required by updated packages
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: eddie_reboot_required.stat.exists

    - name: Refresh facts after package updates and possible reboot
      ansible.builtin.setup:

  roles:
    - role: machines/network
    - role: machines/ipa
      when: "'tag_ipa' in group_names"
    - role: machines/docker
      when: "'tag_docker' in group_names"
    - role: hermes

- name: Finish Eddie GPU, Ollama and local model configuration
  ansible.builtin.import_playbook: setup_hermes_vm.yaml
  vars:
    ai_target: eddie
    ansible_ssh_common_args: "-F /dev/null -o PasswordAuthentication=no"

- name: Verify the completed Eddie installation
  hosts: eddie
  remote_user: ansible
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: "-F /dev/null -o PasswordAuthentication=no"
  tasks:
    - name: Verify IPA resolves the owner account
      ansible.builtin.command: getent passwd denebeim
      register: owner_identity
      changed_when: false
      failed_when: owner_identity.rc != 0 or '/nethome/denebeim' not in owner_identity.stdout

    - name: Verify the owner network home mounts
      ansible.builtin.command: timeout 30 stat /nethome/denebeim
      changed_when: false

    - name: Verify Docker daemon responds
      ansible.builtin.command: docker info
      changed_when: false

    - name: Verify the local runtime services are active
      ansible.builtin.command: systemctl is-active sssd autofs docker ollama hermes-gateway
      changed_when: false

    - name: Verify Hermes answers through its configured local Ollama model
      ansible.builtin.command:
        argv:
          - timeout
          - '300'
          - /home/hermes/.local/bin/hermes
          - chat
          - -Q
          - --oneshot
          - --reasoning
          - none
          - --max-turns
          - '1'
          - -q
          - 'Reply with exactly: Eddie is online. Do not use tools.'
      become_user: hermes
      environment:
        HOME: /home/hermes
        PATH: /home/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
      register: eddie_local_reply
      # Cold plugin discovery can exceed Hermes's fixed session.create RPC
      # deadline. Retry only that startup error; persistent or other failures
      # still fail acceptance, including a wrong or missing model response.
      retries: 2
      delay: 5
      until: >-
        eddie_local_reply.rc == 0 or
        'Gateway did not answer' not in (eddie_local_reply.stdout ~ eddie_local_reply.stderr) or
        'session.create' not in (eddie_local_reply.stdout ~ eddie_local_reply.stderr)
      changed_when: false
      failed_when: eddie_local_reply.rc != 0 or 'Eddie is online.' not in eddie_local_reply.stdout

    - name: Show verified local model reply
      ansible.builtin.debug:
        var: eddie_local_reply.stdout
