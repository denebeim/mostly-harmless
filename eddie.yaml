---
- ansible.builtin.import_playbook: vm.yaml
  vars:
    vm:
      name: "{{ eddie_host | default('eddie') }}"
      id: "{{ eddie_vm_id | default(314) | int }}"
      ip: "{{ eddie_ip | default('192.168.42.132') }}"
      # Keep the Inkling RAM allocation when reconciling Eddie's base profile.
      memory: 28672
      cores: 8
      disk: 64G
      bios: ovmf
      machine: q35
      local_users: [hermes]
      docker_members: [hermes]
      update_packages: true
      tags: [ipa, docker, gpu, ollama, hermes]
      preserve_tags: [librechat]
      initial_tags: "{{ eddie_initial_optional_tags | default(['librechat']) }}"
      hostpci:
        hostpci0: "{{ eddie_gpu_pci | default('0000:81:00,pcie=1') }}"
    hermes_default_model: qwen3.5:4b
    hermes_provider: custom
    hermes_base_url: http://127.0.0.1:11434/v1
    ollama_listen_host: 0.0.0.0
    ollama_verify_lan: true
    ollama_inkling_source: inkling-2-mini:26b-a5b-iq4_NL
    ollama_inkling_model: &inkling_model inkling-2-mini:eddie-cpu
    ollama_enable_inkling: "{{ eddie_enable_inkling | default(false) | bool }}"
    hermes_gpu_devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl

- ansible.builtin.import_playbook: librechat.yaml
  vars:
    librechat_inkling_model: *inkling_model
    librechat_enable_inkling: "{{ eddie_enable_inkling | default(false) | bool }}"
