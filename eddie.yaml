---
# =============================================================================
# Playbook: eddie.yaml
# Description: Provisions a virtual machine on Proxmox VE (heartogold)
#              and installs/configures Nous Research Hermes AI Agent.
# =============================================================================

- name: Provision Hermes VM on Proxmox
  hosts: "heartogold"
  remote_user: root
  gather_facts: false

  vars:
    clone: "deepthot-24-04"
    api_host: "heartogold"
    vmname: "hermes"
    newid: 314
    memory: 16384
    cores: 8
    bios: ovmf
    machine: q35
    vga: serial0
    vm_serial:
      serial0: socket
    hostpci:
      hostpci0: "0000:81:00,pcie=1"
    size: "40G"
    storage: "heartogold"
    IP: "{{ hermes_ip | default('192.168.42.132') }}"
    gateway: "192.168.42.1"
    nameserver: "192.168.42.2"
    searchdomain: "local.deepthot.org"
    mytags:
      - ipa
      - hermes
      - docker

  roles:
    - proxmox/create_vm

  post_tasks:
    - name: Dynamically add Hermes VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ vmname }}"
        ansible_host: "{{ IP }}"
        ansible_user: ansible
        groups:
          - hermes
          - "{{ 'tag_ipa' if 'ipa' in mytags else '' }}"
          - "{{ 'tag_docker' if 'docker' in mytags else '' }}"

    - name: Wait for SSH port 22 on Hermes VM ({{ IP }})
      ansible.builtin.wait_for:
        host: "{{ IP }}"
        port: 22
        search_regex: OpenSSH
        delay: 10
        timeout: 300
      delegate_to: localhost

    - name: Refresh verified SSH trust for Hermes
      ansible.builtin.include_role:
        name: proxmox/ssh_host_key
      vars:
        ssh_host_key_names:
          - "{{ vmname }}"
          - "{{ vmname }}.{{ domain }}"

    - name: Wait for authenticated SSH access to Hermes
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
      delegate_to: "{{ vmname }}"

- name: Configure Hermes VM and Install Hermes Agent
  hosts: hermes
  remote_user: ansible
  become: true
  gather_facts: true

  # These will be picked up from the inventory file we fixed above
  vars:
    ansible_user: ansible
    ansible_ssh_common_args: "-o PasswordAuthentication=no"
    hermes_default_model: qwen3.5:4b
    hermes_gateway_enabled: true
    hermes_provider: custom
    hermes_base_url: http://127.0.0.1:11434/v1

  pre_tasks:
    - name: Wait for cloud-init to finish provisioning
      ansible.builtin.command: cloud-init status --wait --long
      register: cloud_init_status
      changed_when: false
      failed_when: >-
        cloud_init_status.rc != 0 and
        not (
          cloud_init_status.rc == 2 and
          'status: done' in cloud_init_status.stdout and
          'errors: []' in cloud_init_status.stdout
        )

    - name: Wait for apt locks to release
      ansible.builtin.shell: while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 1; done;
      changed_when: false

  roles:
    - role: machines/network
    - role: machines/docker
      when: "'tag_docker' in group_names"
    - role: hermes
